name: Deploy to S3

on:
  push:
    branches:
      - main   # або master, якщо твоя основна гілка так називається

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to S3
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --acl public-read --follow-symlinks
        env:
          AWS_S3_BUCKET: cmtr-hv21yilu-bucket-1777200235   # назва твого бакету
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}  # сюди GitHub візьме секрет
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}  # сюди GitHub візьме секрет
          AWS_REGION: eu-west-1   # регіон твого бакету
          SOURCE_DIR: ./           # директорія з файлами сайту
